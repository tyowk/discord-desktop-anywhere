<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Discord Desktop</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="login">
<main class="card">
  <h1>Discord Desktop</h1>
  <p class="muted">Enter the password to open the remote desktop.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{NEXT}}">
    <label for="pw" class="sr">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="error" role="alert">{{ERROR}}</p>
</main>
</body>
</html>
