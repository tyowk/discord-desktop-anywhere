[project]
name = "discord-desktop-anywhere"
version = "2.0.0"
description = "Run the Discord desktop client in your browser (noVNC) with live audio, on Replit or any Linux."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []   # standard library only

[project.scripts]
dda = "dda.cli:main"

[tool.setuptools.packages.find]
include = ["dda*"]

[tool.setuptools.package-data]
dda = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045", "SIM105", "SIM108", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
